<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="热气球">
<meta name="theme-color" content="#ff6b5e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<title>热气球大冒险</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0b1026;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    user-select: none; -webkit-user-select: none;
    touch-action: none;
  }
  #game {
    display: block; position: fixed; inset: 0;
    touch-action: none; z-index: 1;
  }
  /* 热气球用 DOM <img> 显示，保证 iOS Safari 上 GIF 动画正常播放 */
  #balloonImg {
    position: fixed; left: 0; top: 0;
    pointer-events: none; z-index: 2; display: none;
    will-change: left, top, width, height;
    transform: translateZ(0);
  }
  /* HUD 分数 */
  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    padding: calc(env(safe-area-inset-top) + 14px) 18px 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: none; z-index: 5;
    color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,.35);
  }
  #score { font-size: 40px; font-weight: 800; letter-spacing: 1px; }
  #best  { font-size: 15px; opacity: .85; margin-top: 8px; text-align: right; }
  /* 免疫进度条 */
  #immuneBar {
    position: fixed; left: 50%; transform: translateX(-50%);
    top: calc(env(safe-area-inset-top) + 64px);
    width: 160px; height: 8px; border-radius: 8px;
    background: rgba(255,255,255,.25); overflow: hidden;
    pointer-events: none; z-index: 5; opacity: 0; transition: opacity .2s;
  }
  #immuneBar > i { display: block; height: 100%; width: 100%;
    background: linear-gradient(90deg,#ff5d5d,#ffd24d,#5dff8f,#5db8ff,#c45dff); }
  #magnetBar {
    position: fixed; left: 50%; transform: translateX(-50%);
    top: calc(env(safe-area-inset-top) + 80px);
    width: 160px; height: 8px; border-radius: 8px;
    background: rgba(255,255,255,.25); overflow: hidden;
    pointer-events: none; z-index: 5; opacity: 0; transition: opacity .2s;
  }
  #magnetBar > i { display: block; height: 100%; width: 100%;
    background: linear-gradient(90deg,#39c6ff,#7af0ff); }

  /* 覆盖层（开始 / 结束） */
  .overlay {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; color: #fff; padding: 24px;
    background: radial-gradient(120% 120% at 50% 30%, rgba(20,30,70,.55), rgba(8,12,30,.85));
    backdrop-filter: blur(2px);
  }
  .overlay.hidden { display: none; }
  .overlay h1 { font-size: 34px; font-weight: 800; margin-bottom: 14px;
    text-shadow: 0 3px 10px rgba(0,0,0,.4); }
  .overlay p { font-size: 16px; line-height: 1.7; opacity: .9; max-width: 320px; margin-bottom: 6px; }
  .overlay .tip { font-size: 14px; opacity: .7; margin-top: 10px; }
  .btn {
    margin-top: 26px; padding: 14px 42px; font-size: 19px; font-weight: 700;
    color: #1a1a2e; background: linear-gradient(180deg,#ffe27a,#ffc24d);
    border: none; border-radius: 999px; cursor: pointer;
    box-shadow: 0 8px 22px rgba(255,180,60,.45);
  }
  .btn:active { transform: scale(.96); }
  .final { font-size: 22px; font-weight: 700; margin: 4px 0; }
  .final b { color: #ffd24d; font-size: 30px; }
</style>
</head>
<body>
  <canvas id="game"></canvas>
  <img id="balloonImg" src="assets/gif_color_hotAirBalloon.gif" alt="" />

  <div id="hud">
    <div>
      <div id="score">0</div>
    </div>
    <div id="best">最高 0</div>
  </div>
  <div id="immuneBar"><i></i></div>
  <div id="magnetBar"><i></i></div>

  <div id="ready" class="overlay">
    <h1>🎈 热气球大冒险</h1>
    <p>左右拖动热气球（高度固定），躲开红色栅栏缺口</p>
    <p>收集金币得分，分数越高障碍下落越快</p>
    <p class="tip">⚡ 彩色方块 = 变色+短暂免疫；🧲 蓝色磁铁 = 短暂吸附金币</p>
    <button class="btn" id="startBtn">开始游戏</button>
  </div>

  <div id="over" class="overlay hidden">
    <h1>游戏结束</h1>
    <p class="final">本局得分 <b id="finalScore">0</b></p>
    <p class="final">最高得分 <span id="bestScore">0</span></p>
    <button class="btn" id="retryBtn">再来一次</button>
  </div>

<script src="game.js"></script>
<script>
  // 注册 Service Worker，使游戏可"添加到主屏幕"并离线运行
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
